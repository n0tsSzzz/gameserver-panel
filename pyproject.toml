[project]
name = "gamehost"
version = "0.0.0"
description = "GameHost — managed game server platform (workspace root)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/node_agent", "apps/worker", "packages/shared"]

[tool.uv.sources]
gamehost-shared = { workspace = true }
gamehost-api = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "testcontainers[postgres]>=4.8,<5",
    "pytest-cov>=5,<7",
    "polyfactory>=2.18,<3",
    "types-python-jose>=3.3,<4",
    "types-requests>=2.32,<3",
    "respx>=0.21,<1",
    "fakeredis>=2.26,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/node_agent/src", "apps/worker/src", "packages/shared/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM"]
"**/domain/exceptions.py" = ["N818"]
"**/api/**" = ["B008"]
"**/tests/factories.py" = ["B"]
"**/clients/node_agent_client.py" = ["N818"]
"**/gamehost_worker/main.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "apps/api/src",
    "apps/api",
    "apps/node_agent/src",
    "apps/worker/src",
    "packages/shared/src",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "email_validator",
    "docker",
    "docker.*",
    "redis.*",
    "fakeredis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.conftest"]
disable_error_code = ["no-redef"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/node_agent/tests", "apps/worker/tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing --cov-fail-under=70 -m 'not docker_real'"
markers = [
    "docker_real: requires a real Docker daemon; skipped by default",
]

[tool.coverage.run]
branch = true
source = [
    "apps/api/src/gamehost_api",
    "apps/node_agent/src/gamehost_node",
    "apps/worker/src/gamehost_worker",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
