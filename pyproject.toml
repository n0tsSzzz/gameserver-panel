[project]
name = "gamehost"
version = "0.0.0"
description = "GameHost — managed game server platform (workspace root)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/shared"]

[tool.uv.sources]
gamehost-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "testcontainers[postgres]>=4.8,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "packages/shared/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "packages/shared/src"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
addopts = "-ra --strict-markers"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
