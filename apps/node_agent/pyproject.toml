[project]
name = "gamehost-node"
version = "0.0.0"
description = "GameHost node-agent (Docker SDK proxy on each game node)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
    "docker>=7,<8",
    "structlog>=24,<26",
    "gamehost-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamehost_node"]
