[project]
name = "gamehost-api"
version = "0.0.0"
description = "GameHost public REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "python-jose[cryptography]>=3.3,<4",
    "structlog>=24,<26",
    "prometheus-fastapi-instrumentator>=7,<8",
    "gamehost-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamehost_api"]
