[project]
name = "gamehost-worker"
version = "0.0.0"
description = "GameHost ARQ worker — runs lifecycle jobs against node-agent"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26,<1",
    "httpx>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "structlog>=24,<26",
    "pydantic-settings>=2.6,<3",
    "gamehost-shared",
    "gamehost-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamehost_worker"]
